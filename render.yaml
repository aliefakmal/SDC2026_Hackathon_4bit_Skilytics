services:
  - type: web
    name: skilytics-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_5UVvJISyL0Wu@ep-royal-shape-aol47eri.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL_UNPOOLED
        value: postgresql://neondb_owner:npg_5UVvJISyL0Wu@ep-royal-shape-aol47eri.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: SESSION_SECRET
        generateValue: true
      - key: RUNPOD_API_KEY
        sync: false
      - key: RUNPOD_LLM_ENDPOINT_ID
        sync: false
      - key: RUNPOD_LIGHT_ENDPOINT_ID
        sync: false
      - key: RUNPOD_LLM_MODEL
        value: qwen/qwen3.5-27b
      - key: RUNPOD_LIGHT_MODEL
        value: qwen/qwen3.5-9b
